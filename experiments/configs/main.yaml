# Main dataset for the thesis (Phase 2). Run on the Mac M2:
#   python experiments/generate.py --config experiments/configs/main.yaml
#   python experiments/label.py    --config experiments/configs/main.yaml --p 1 2 3
# Sizes agreed 2026-11-02: train 8-16 vertices, test up to 20, depth p <= 3.
name: main
db: data/main.db
seed: 2026

families:                     # synthetic families (sparse regime, Lemma B)
  ER:  {edge_p: 0.5}          # Erdos-Renyi, weights ~ U(0,1)
  REG: {degree: 3}            # unweighted 3-regular (sizes must be even)

synthetic:
  train: {sizes: [8, 10, 12, 14, 16], per_size: 40}          # per family -> 200 graphs
  test:  {sizes: [8, 10, 12, 14, 16, 18, 20], per_size: 16}  # per family -> 112 graphs (18, 20 = generalisation)

dvrp:                         # dense regime (Lemma A, D0); split by WHOLE stream (no leakage)
  common: {rate: 1.0, mean_service: 12.0, n_clusters: 3, spread: 0.08}
  train: {streams: 10, events: 60, n_min: 8, n_max: 16}
  test:  {streams: 4, events: 80, n_min: 12, n_max: 20, rate: 1.4}   # mean load 1.4*12 = 17

labels:                       # best-known angles = label (multi-start, 'best found', not proven optimal)
  p: [1, 2, 3]
  n_starts: 10                # random starts; plus INTERP from p-1 and the previous snapshot's label
  optimizer: L-BFGS-B
