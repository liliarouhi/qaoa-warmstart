[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa-warmstart"
version = "0.2.0"
description = "Learned and cached warm-starts for QAOA on weighted Max-Cut, applied to dynamic vehicle routing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lilia Rouhi" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
]

[project.optional-dependencies]
quantum = ["pennylane>=0.38"]          # used to validate the NumPy simulator
ml = ["torch>=2.2", "scikit-learn>=1.4"]  # Phase 3 models
dev = ["pytest>=8", "pyyaml>=6", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qws.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
